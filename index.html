<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiến Thị Thu Nhi | Marketing Portfolio</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fdfbf7;
            --primary-color: #e8a598;
            --accent-color: #d97762;
            --text-dark: #332725;
            --text-muted: #786865;
            --card-bg: #ffffff;
            --sidebar-bg: #fffbf8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
        }

        /* Floating Sidebar Navigation */
        .sidebar-nav {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 10px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
            border: 1px solid rgba(232, 165, 152, 0.2);
        }

        .sidebar-nav a {
            color: var(--text-muted);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .sidebar-nav a:hover {
            background-color: var(--primary-color);
            color: white;
            transform: scale(1.1);
        }

        .main-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            width: 100%;
        }

        /* Hero Section */
        .hero {
            display: flex;
            align-items: center;
            gap: 40px;
            margin-bottom: 60px;
            background: linear-gradient(135deg, #fef5f0 0%, #fcf0ea 100%);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid #f5e1da;
        }

        .hero-img-container {
            flex: 0 0 280px;
            height: 350px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(217, 119, 98, 0.15);
        }

        .hero-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-content h1 {
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .hero-subtitle {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-bio {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.98rem;
        }

        .contact-info {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            font-size: 0.9rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 8px 16px;
            border-radius: 20px;
            color: var(--text-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        /* Section Styling */
        section {
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #eee0dc;
            margin-left: 10px;
        }

        /* Cards Grid */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            border: 1px solid #f5ebe8;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-50px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--text-dark);
        }

        .card-badge {
            background: #fdf2ef;
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .card-sub {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
